<!DOCTYPE html>
<html lang="mn"><head><meta charset="utf-8"><title>Tatar Shield — Логик тест</title>
<style>
body{font-family:system-ui,'Segoe UI',Arial,sans-serif;background:#0b1220;color:#e5edf7;margin:0;padding:24px;}
h1{font-size:20px;margin:0 0 4px;} .sub{color:#8aa0bd;font-size:13px;margin-bottom:16px;}
.summary{font-size:16px;font-weight:700;margin:12px 0;padding:10px 14px;border-radius:8px;display:inline-block;}
table{border-collapse:collapse;width:100%;font-size:13px;} th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #1f2b45;}
th{color:#8aa0bd;} td.host{font-family:ui-monospace,monospace;}
.pass{color:#22c55e;font-weight:700;} .fail{color:#f87171;font-weight:700;}
.lvl-high{color:#f87171;} .lvl-suspicious{color:#fbbf24;} .lvl-safe{color:#4ade80;} .muted{color:#8aa0bd;}
</style></head><body>
<h1>🛡️ Tatar Shield — Илрүүлэлтийн логик тест</h1>
<div class="sub">src/lib/banks.js + src/lib/idn.js-ийг ШУУД ачаална. Бодит сайт нээхгүйгээр илрүүлэлтийг шалгана.</div>
<div id="summary"></div>
<table><thead><tr><th>Хаяг</th><th>Хүлээж буй</th><th>Гарсан</th><th>Оноо</th><th>Банк</th><th>Шалтгаан</th><th>Үр дүн</th></tr></thead>
<tbody id="rows"></tbody></table>
<!-- ЖИНХЭНЭ эх кодыг ачаална. Хуулбар тавибал src/-ээс зөрж, тест нь
     бүтээгдэхүүнийг биш, хуулбарыг шалгах болно (өмнө нь тэгж байсан). -->
<script src="../src/lib/banks.js"></script>
<script src="../src/lib/idn.js"></script>
<!-- Кейсүүд нь test/run.js-тэй ХУВААЛЦСАН нэг файлд байна (хуулбар биш). -->
<script src="cases.js"></script>
<script>
var CASES=TATAR_CASES;
var rows=document.getElementById("rows"),pass=0;
CASES.forEach(function(c){var r=TATAR_IDN.analyzeHost(c.h);
 var ok=(r.level===c.exp)&&(c.official===undefined||!!r.official===c.official);if(ok)pass++;
 var tr=document.createElement("tr");
 tr.innerHTML='<td class="host">'+c.h+'</td><td class="lvl-'+c.exp+'">'+c.exp+(c.official?" (official)":"")+
 '</td><td class="lvl-'+r.level+'">'+r.level+(r.official?" (official)":"")+'</td><td>'+r.score+
 '</td><td>'+((r.bankName||r.nearestName)||'—')+'</td><td class="muted">'+((r.reasons||[]).join(", ")||'—')+
 '</td><td class="'+(ok?"pass":"fail")+'">'+(ok?"✔ PASS":"✘ FAIL")+'</td>';rows.appendChild(tr);});
var s=document.getElementById("summary"),all=CASES.length;s.className="summary";
s.style.background=(pass===all)?"#0e2a17":"#3b0d0d";s.style.color=(pass===all)?"#bbf7d0":"#fecaca";
s.textContent=(pass===all?"✅ БҮГД ТЭНЦЛЭЭ":"⚠ АНХААР")+" — "+pass+" / "+all+" тест PASS";
</script></body></html>
